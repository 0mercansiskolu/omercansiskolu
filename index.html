<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basit Tarayıcı — Gerçek Arama Verileri</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    form {
      display: flex;
      width: 100%;
      max-width: 700px;
      background: #1e293b;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      outline: none;
      background: none;
      color: #f1f5f9;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #0ea5e9;
    }

    #results {
      width: 100%;
      max-width: 700px;
      margin-top: 30px;
    }

    .result {
      background: #1e293b;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      transition: transform 0.2s, background 0.2s;
    }

    .result:hover {
      transform: translateY(-2px);
      background: #273449;
    }

    .result a {
      text-decoration: none;
      color: #38bdf8;
      font-size: 18px;
      font-weight: 600;
    }

    .result p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .meta {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>🔎 Basit Web Tarayıcı</h1>

  <form id="searchForm">
    <input type="text" id="query" placeholder="Aramak istediğin şeyi yaz..." required>
    <button type="submit">Ara</button>
  </form>

  <div id="results"></div>

  <script>
    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const resultsDiv = document.getElementById("results");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;

      resultsDiv.innerHTML = "<p>Aranıyor...</p>";

      try {
        // DuckDuckGo Instant Answer API — gerçek veriler!
        const response = await fetch(
          `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_redirect=1&no_html=1`
        );
        const data = await response.json();

        const topics = data.RelatedTopics || [];
        resultsDiv.innerHTML = "";

        if (topics.length === 0) {
          resultsDiv.innerHTML = "<p>Sonuç bulunamadı.</p>";
          return;
        }

        topics.slice(0, 10).forEach((item) => {
          const text = item.Text || (item.Topics && item.Topics[0]?.Text) || "";
          const link = item.FirstURL || (item.Topics && item.Topics[0]?.FirstURL) || "#";

          if (text) {
            const el = document.createElement("div");
            el.className = "result";
            el.innerHTML = `
              <a href="${link}" target="_blank">${text.split(" - ")[0]}</a>
              <p>${text}</p>
              <div class="meta">${link}</div>
            `;
            resultsDiv.appendChild(el);
          }
        });
      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = "<p>Bir hata oluştu. İnternet bağlantını kontrol et.</p>";
      }
    });
  </script>
</body>
</html>
