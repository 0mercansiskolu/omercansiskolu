<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaSearch — Gelişmiş Arama Motoru</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 20px;
      text-align: center;
      background: rgba(30, 41, 59, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 28px;
      color: #38bdf8;
      margin: 0 0 10px 0;
      letter-spacing: 1px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 800px;
      background: #1e293b;
      border-radius: 50px;
      overflow: hidden;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .search-bar input {
      flex: 1;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      outline: none;
      background: none;
      color: #f1f5f9;
    }

    .search-bar button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .search-bar button:hover {
      background: #0ea5e9;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    nav button {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    nav button.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
    }

    nav button:hover {
      background: #1e293b;
      color: #f1f5f9;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 30px 20px;
    }

    .result {
      background: #1e293b;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      transition: transform 0.2s, background 0.2s;
    }

    .result:hover {
      transform: translateY(-3px);
      background: #273449;
    }

    .result a {
      text-decoration: none;
      color: #38bdf8;
      font-size: 18px;
      font-weight: 600;
    }

    .result p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .meta {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NovaSearch 🔎</h1>
    <form id="searchForm" class="search-bar">
      <input type="text" id="query" placeholder="Aramak istediğin şeyi yaz..." required />
      <button type="submit">Ara</button>
    </form>

    <nav>
      <button class="active" data-tab="web">Web</button>
      <button data-tab="images">Görseller</button>
      <button data-tab="videos">Videolar</button>
      <button data-tab="news">Haberler</button>
    </nav>
  </header>

  <main id="results"></main>

  <footer>© 2025 NovaSearch — Yapay zeka destekli akıllı arama motoru</footer>

  <script>
    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const resultsDiv = document.getElementById("results");
    const navButtons = document.querySelectorAll("nav button");

    // Sekme geçişi
    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        navButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    // Arama fonksiyonu
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;

      resultsDiv.innerHTML = "<p>Aranıyor...</p>";

      try {
        const response = await fetch(
          `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_redirect=1&no_html=1`
        );
        const data = await response.json();

        const topics = data.RelatedTopics || [];
        resultsDiv.innerHTML = "";

        if (topics.length === 0) {
          resultsDiv.innerHTML = "<p>Sonuç bulunamadı.</p>";
          return;
        }

        topics.slice(0, 12).forEach((item) => {
          const text = item.Text || (item.Topics && item.Topics[0]?.Text) || "";
          const link = item.FirstURL || (item.Topics && item.Topics[0]?.FirstURL) || "#";

          if (text) {
            const el = document.createElement("div");
            el.className = "result";
            el.innerHTML = `
              <a href="${link}" target="_blank">${text.split(" - ")[0]}</a>
              <p>${text}</p>
              <div class="meta">${link}</div>
            `;
            resultsDiv.appendChild(el);
          }
        });
      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = "<p>Bir hata oluştu. İnternet bağlantını kontrol et.</p>";
      }
    });
  </script>
</body>
</html>
