name: Kelime Harikalari APK Build v1.3 Clean

on:
  push:
    branches: [chatgpt-kelime-harikalari-apk-20261025]
    paths:
      - '.github/workflows/kelime-harikalari-apk-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create clean Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf KelimeHarikalariAndroid
          mkdir -p KelimeHarikalariAndroid/app/src/main/java/com/omercansiskolu/kelimeharikalari
          mkdir -p KelimeHarikalariAndroid/app/src/main/res/layout
          mkdir -p KelimeHarikalariAndroid/app/src/main/res/values
          mkdir -p KelimeHarikalariAndroid/app/src/main/res/drawable-nodpi
          mkdir -p KelimeHarikalariAndroid/app/src/main/assets

          cp apk-assets/index.html KelimeHarikalariAndroid/app/src/main/assets/index.html
          cp apk-assets/app_icon.png KelimeHarikalariAndroid/app/src/main/res/drawable-nodpi/app_icon.png

          cat > KelimeHarikalariAndroid/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KelimeHarikalari'
          include ':app'
          EOT

          cat > KelimeHarikalariAndroid/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT

          cat > KelimeHarikalariAndroid/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOT

          cat > KelimeHarikalariAndroid/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.omercansiskolu.kelimeharikalari'
            compileSdk 35
            defaultConfig {
              applicationId 'com.omercansiskolu.kelimeharikalari'
              minSdk 24
              targetSdk 35
              versionCode 13
              versionName '1.3'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOT

          cat > KelimeHarikalariAndroid/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:label="Kelime Harikaları"
              android:icon="@drawable/app_icon"
              android:roundIcon="@drawable/app_icon"
              android:theme="@style/Theme.KelimeHarikalari"
              android:supportsRtl="true"
              android:hardwareAccelerated="true">
              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT

          cat > KelimeHarikalariAndroid/app/src/main/res/values/styles.xml <<'EOT'
          <resources>
            <style name="Theme.KelimeHarikalari" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowBackground">#07101F</item>
              <item name="android:statusBarColor">#07101F</item>
              <item name="android:navigationBarColor">#07101F</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOT

          cat > KelimeHarikalariAndroid/app/src/main/res/layout/activity_main.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07101F">
            <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07101F"/>
          </FrameLayout>
          EOT

          cat > KelimeHarikalariAndroid/app/src/main/java/com/omercansiskolu/kelimeharikalari/MainActivity.java <<'EOT'
          package com.omercansiskolu.kelimeharikalari;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);
              webView = findViewById(R.id.webView);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);
              settings.setMediaPlaybackRequiresUserGesture(false);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);
              settings.setSupportZoom(false);
              settings.setTextZoom(100);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }

            @Override protected void onDestroy() {
              if (webView != null) {
                webView.stopLoading();
                webView.destroy();
                webView = null;
              }
              super.onDestroy();
            }
          }
          EOT

      - name: Build APK with official D8 Gradle toolchain
        run: gradle -p KelimeHarikalariAndroid :app:assembleDebug --stacktrace

      - name: Verify APK and all DEX files
        shell: bash
        run: |
          set -euxo pipefail
          APK=KelimeHarikalariAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -j "$APK" 'classes*.dex' -d /tmp/dexcheck
          test -n "$(find /tmp/dexcheck -name 'classes*.dex' -print -quit)"
          FOUND=0
          for dex in /tmp/dexcheck/classes*.dex; do
            "$ANDROID_HOME/build-tools/35.0.0/dexdump" -f "$dex" > "$dex.txt"
            if grep -q 'MainActivity' "$dex.txt" && grep -q 'omercansiskolu' "$dex.txt"; then FOUND=1; fi
          done
          test "$FOUND" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.omercansiskolu.kelimeharikalari'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Kelime-Harikalari-v1.3-clean.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Harikalari-v1.3-clean
          path: Kelime-Harikalari-v1.3-clean.apk
          if-no-files-found: error
          retention-days: 30
