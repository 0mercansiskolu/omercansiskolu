name: Lacivert Sports APK Build v1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/larcivert-sports-apk-v11.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 35 bileşenleri
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android projesini oluştur
        shell: bash
        run: |
          rm -rf LacivertSportsAndroid
          mkdir -p LacivertSportsAndroid/app/src/main/java/com/larcivertsports/app
          mkdir -p LacivertSportsAndroid/app/src/main/res/layout
          mkdir -p LacivertSportsAndroid/app/src/main/res/values
          mkdir -p LacivertSportsAndroid/app/src/main/res/drawable

          cat > LacivertSportsAndroid/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'LacivertSports'
          include ':app'
          EOF

          cat > LacivertSportsAndroid/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > LacivertSportsAndroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > LacivertSportsAndroid/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.larcivertsports.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.larcivertsports.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > LacivertSportsAndroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:icon="@drawable/app_icon" android:label="Lacivert Sports" android:roundIcon="@drawable/app_icon" android:supportsRtl="true" android:theme="@style/Theme.LacivertSports" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" android:exported="true" android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > LacivertSportsAndroid/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#050816">
              <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
              <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="3dp" android:layout_gravity="top" android:max="100" />
          </FrameLayout>
          EOF

          cat > LacivertSportsAndroid/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LacivertSports" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:navigationBarColor">#050816</item>
                  <item name="android:statusBarColor">#050816</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > LacivertSportsAndroid/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#050816" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#2563EB" android:pathData="M14,14h80v80h-80z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M29,27h12v42h25v12h-37z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M61,27h18v12h-18v9h15v12h-15v21h-12v-54z"/>
          </vector>
          EOF

          cat > LacivertSportsAndroid/app/src/main/java/com/larcivertsports/app/MainActivity.java <<'EOF'
          package com.larcivertsports.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {
              private static final String HOME_URL = "https://larcivertsports2.blogspot.com/";
              private WebView webView;
              private ProgressBar progressBar;
              private FrameLayout root;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private int previousOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;

              @SuppressLint("SetJavaScriptEnabled")
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  setContentView(R.layout.activity_main);
                  root = findViewById(R.id.root);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (scheme == null || scheme.equals("http") || scheme.equals("https")) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); return true; }
                          catch (Exception ignored) { return false; }
                      }
                      @Override public void onPageStarted(WebView view, String url, Bitmap favicon) { progressBar.setVisibility(View.VISIBLE); }
                      @Override public void onPageFinished(WebView view, String url) { progressBar.setVisibility(View.GONE); }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                          progressBar.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                      @Override public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) { callback.onCustomViewHidden(); return; }
                          customView = view;
                          customViewCallback = callback;
                          previousOrientation = getRequestedOrientation();
                          webView.setVisibility(View.GONE);
                          progressBar.setVisibility(View.GONE);
                          root.addView(customView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }
                      @Override public void onHideCustomView() { exitFullscreenVideo(); }
                  });

                  if (savedInstanceState == null) webView.loadUrl(HOME_URL); else webView.restoreState(savedInstanceState);
              }

              private void exitFullscreenVideo() {
                  if (customView == null) return;
                  root.removeView(customView);
                  customView = null;
                  webView.setVisibility(View.VISIBLE);
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  setRequestedOrientation(previousOrientation);
                  if (customViewCallback != null) { customViewCallback.onCustomViewHidden(); customViewCallback = null; }
              }

              @Override public void onBackPressed() {
                  if (customView != null) exitFullscreenVideo();
                  else if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
          }
          EOF

      - name: APK derle
        run: gradle -p LacivertSportsAndroid :app:assembleDebug --stacktrace
      - name: APK yeniden adlandır
        run: cp LacivertSportsAndroid/app/build/outputs/apk/debug/app-debug.apk LacivertSports-v1.1.apk
      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: LacivertSports-APK-v1.1
          path: LacivertSports-v1.1.apk
          if-no-files-found: error
          retention-days: 30
