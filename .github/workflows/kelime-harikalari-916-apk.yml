name: Kelime Harikalari 9x16 APK v1.6

on:
  push:
    branches: [chatgpt-kelime-harikalari-apk-20261025]
    paths:
      - '.github/workflows/kelime-harikalari-916-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-916-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact 9x16 game HTML
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d portrait916/kh916.html.gz.b64 > /tmp/kh916.html.gz
          gzip -dc /tmp/kh916.html.gz > /tmp/index.html
          echo '4ae93fc1db7b23544c816d803df0eb2088de8eb40844783199a2874c5d7bd8c8  /tmp/index.html' | sha256sum -c -
          grep -q 'portrait-shell' /tmp/index.html
          grep -q 'portrait-stage' /tmp/index.html
          grep -q 'viewport-fit=cover' /tmp/index.html
          grep -q 'KELİME HARİKALARI' /tmp/index.html

      - name: Create clean Android 9x16 project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf KelimeHarikalari916
          mkdir -p KelimeHarikalari916/app/src/main/java/com/omercansiskolu/kelimeharikalari/portrait916
          mkdir -p KelimeHarikalari916/app/src/main/res/layout
          mkdir -p KelimeHarikalari916/app/src/main/res/values
          mkdir -p KelimeHarikalari916/app/src/main/res/drawable-nodpi
          mkdir -p KelimeHarikalari916/app/src/main/assets

          cp /tmp/index.html KelimeHarikalari916/app/src/main/assets/index.html
          cp apk-assets/app_icon.png KelimeHarikalari916/app/src/main/res/drawable-nodpi/app_icon.png

          cat > KelimeHarikalari916/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KelimeHarikalari916'
          include ':app'
          EOT

          cat > KelimeHarikalari916/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT

          cat > KelimeHarikalari916/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOT

          cat > KelimeHarikalari916/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.omercansiskolu.kelimeharikalari.portrait916'
            compileSdk 35
            defaultConfig {
              applicationId 'com.omercansiskolu.kelimeharikalari.portrait916'
              minSdk 24
              targetSdk 35
              versionCode 16
              versionName '1.6-916'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOT

          cat > KelimeHarikalari916/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:label="Kelime Harikaları"
              android:icon="@drawable/app_icon"
              android:roundIcon="@drawable/app_icon"
              android:theme="@style/Theme.KelimeHarikalari"
              android:supportsRtl="true"
              android:hardwareAccelerated="true">
              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT

          cat > KelimeHarikalari916/app/src/main/res/values/styles.xml <<'EOT'
          <resources>
            <style name="Theme.KelimeHarikalari" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowBackground">#07101F</item>
              <item name="android:statusBarColor">#07101F</item>
              <item name="android:navigationBarColor">#07101F</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          EOT

          cat > KelimeHarikalari916/app/src/main/res/layout/activity_main.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#07101F">
            <WebView
              android:id="@+id/webView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#07101F" />
          </FrameLayout>
          EOT

          cat > KelimeHarikalari916/app/src/main/java/com/omercansiskolu/kelimeharikalari/portrait916/MainActivity.java <<'EOT'
          package com.omercansiskolu.kelimeharikalari.portrait916;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.webView);
              webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
              webView.setVerticalScrollBarEnabled(false);
              webView.setHorizontalScrollBarEnabled(false);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);
              settings.setMediaPlaybackRequiresUserGesture(false);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);
              settings.setSupportZoom(false);
              settings.setTextZoom(100);
              settings.setLoadWithOverviewMode(false);
              settings.setUseWideViewPort(false);

              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }

            @Override
            protected void onDestroy() {
              if (webView != null) {
                webView.stopLoading();
                webView.destroy();
                webView = null;
              }
              super.onDestroy();
            }
          }
          EOT

      - name: Build APK using official Gradle D8 toolchain
        run: gradle -p KelimeHarikalari916 :app:assembleDebug --stacktrace

      - name: Verify 9x16 APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=KelimeHarikalari916/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -t "$APK"
          "$BT/aapt" dump badging "$APK" | grep "package: name='com.omercansiskolu.kelimeharikalari.portrait916'"
          "$BT/apksigner" verify --verbose "$APK"

          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          echo '4ae93fc1db7b23544c816d803df0eb2088de8eb40844783199a2874c5d7bd8c8  /tmp/apk-index.html' | sha256sum -c -
          grep -q 'portrait-shell' /tmp/apk-index.html
          grep -q 'portrait-stage' /tmp/apk-index.html

          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -j "$APK" 'classes*.dex' -d /tmp/dexcheck
          FOUND=0
          for dex in /tmp/dexcheck/classes*.dex; do
            "$BT/dexdump" -f "$dex" > "$dex.txt"
            if grep -q 'MainActivity' "$dex.txt" && grep -q 'portrait916' "$dex.txt"; then FOUND=1; fi
          done
          test "$FOUND" -eq 1

          cp "$APK" Kelime-Harikalari-v1.6-9x16.apk

      - name: Upload verified 9x16 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Harikalari-v1.6-9x16
          path: Kelime-Harikalari-v1.6-9x16.apk
          if-no-files-found: error
          retention-days: 30
