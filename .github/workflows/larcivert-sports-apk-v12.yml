name: Lacivert Sports APK Build v1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/larcivert-sports-apk-v12.yml']

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android projesini oluştur
        shell: bash
        run: |
          rm -rf LacivertSportsAndroid
          mkdir -p LacivertSportsAndroid/app/src/main/java/com/larcivertsports/app LacivertSportsAndroid/app/src/main/res/layout LacivertSportsAndroid/app/src/main/res/values LacivertSportsAndroid/app/src/main/res/drawable
          cat > LacivertSportsAndroid/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='LacivertSports'
          include ':app'
          EOF
          cat > LacivertSportsAndroid/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > LacivertSportsAndroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > LacivertSportsAndroid/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.larcivertsports.app'; compileSdk 35; defaultConfig { applicationId 'com.larcivertsports.app'; minSdk 24; targetSdk 35; versionCode 3; versionName '1.2' } }
          EOF
          cat > LacivertSportsAndroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon" android:label="Lacivert Sports" android:supportsRtl="true" android:theme="@style/Theme.LacivertSports" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" android:exported="true" android:screenOrientation="unspecified">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > LacivertSportsAndroid/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.LacivertSports" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:windowBackground">#04102A</item><item name="android:colorAccent">#2563EB</item><item name="android:navigationBarColor">#04102A</item><item name="android:statusBarColor">#04102A</item><item name="android:windowLightStatusBar">false</item><item name="android:windowLightNavigationBar">false</item></style></resources>
          EOF
          cat > LacivertSportsAndroid/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#04102A">
            <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#04102A"/>
            <FrameLayout android:id="@+id/loadingOverlay" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#04102A" android:clickable="true" android:focusable="true">
              <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:orientation="vertical" android:padding="32dp">
                <ImageView android:layout_width="220dp" android:layout_height="220dp" android:adjustViewBounds="true" android:scaleType="fitCenter" android:src="@drawable/app_icon" android:contentDescription="Lacivert Sports"/>
                <ProgressBar style="?android:attr/progressBarStyle" android:layout_width="48dp" android:layout_height="48dp" android:layout_marginTop="24dp" android:indeterminate="true"/>
              </LinearLayout>
            </FrameLayout>
            <ProgressBar android:id="@+id/progressBar" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="3dp" android:layout_gravity="top" android:max="100"/>
          </FrameLayout>
          EOF
          echo '' | base64 -d > LacivertSportsAndroid/app/src/main/res/drawable/app_icon.jpg
          cat > LacivertSportsAndroid/app/src/main/java/com/larcivertsports/app/MainActivity.java <<'EOF'
          package com.larcivertsports.app;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          public class MainActivity extends Activity {
            private static final String HOME_URL="https://larcivertsports2.blogspot.com/";
            private WebView webView; private ProgressBar progressBar; private FrameLayout root; private View loadingOverlay; private View customView; private WebChromeClient.CustomViewCallback customViewCallback; private int previousOrientation=ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED;
            @SuppressLint("SetJavaScriptEnabled") @Override protected void onCreate(Bundle b){ super.onCreate(b); requestWindowFeature(Window.FEATURE_NO_TITLE); setContentView(R.layout.activity_main); root=findViewById(R.id.root); webView=findViewById(R.id.webView); progressBar=findViewById(R.id.progressBar); loadingOverlay=findViewById(R.id.loadingOverlay); webView.setBackgroundColor(Color.rgb(4,16,42)); WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false); s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE); CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(webView,true);
              webView.setWebViewClient(new WebViewClient(){ @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){ Uri u=r.getUrl(); String sc=u.getScheme(); if(sc==null||sc.equals("http")||sc.equals("https")) return false; try{startActivity(new Intent(Intent.ACTION_VIEW,u));return true;}catch(Exception e){return false;} } @Override public void onPageStarted(WebView v,String u,Bitmap f){progressBar.setVisibility(View.VISIBLE);loadingOverlay.setVisibility(View.VISIBLE);} @Override public void onPageFinished(WebView v,String u){progressBar.setVisibility(View.GONE);v.evaluateJavascript("(function(){document.documentElement.style.background='#04102A';document.body.style.background='#04102A';})();",null);loadingOverlay.animate().alpha(0f).setDuration(220).withEndAction(()->{loadingOverlay.setVisibility(View.GONE);loadingOverlay.setAlpha(1f);}).start();} });
              webView.setWebChromeClient(new WebChromeClient(){ @Override public void onProgressChanged(WebView v,int p){progressBar.setProgress(p);progressBar.setVisibility(p>=100?View.GONE:View.VISIBLE);} @Override public void onPermissionRequest(PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));} @Override public void onShowCustomView(View v,CustomViewCallback cb){if(customView!=null){cb.onCustomViewHidden();return;}customView=v;customViewCallback=cb;previousOrientation=getRequestedOrientation();loadingOverlay.setVisibility(View.GONE);webView.setVisibility(View.GONE);progressBar.setVisibility(View.GONE);root.addView(customView,new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.MATCH_PARENT));setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);} @Override public void onHideCustomView(){exitFullscreenVideo();} });
              if(b==null){loadingOverlay.setVisibility(View.VISIBLE);webView.loadUrl(HOME_URL);}else webView.restoreState(b);
            }
            private void exitFullscreenVideo(){if(customView==null)return;root.removeView(customView);customView=null;webView.setVisibility(View.VISIBLE);getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);setRequestedOrientation(previousOrientation);if(customViewCallback!=null){customViewCallback.onCustomViewHidden();customViewCallback=null;}}
            @Override public void onBackPressed(){if(customView!=null)exitFullscreenVideo();else if(webView.canGoBack())webView.goBack();else super.onBackPressed();}
            @Override protected void onSaveInstanceState(Bundle o){webView.saveState(o);super.onSaveInstanceState(o);}
          }
          EOF
      - name: APK derle
        run: gradle -p LacivertSportsAndroid :app:assembleDebug --stacktrace
      - name: APK yeniden adlandır
        run: cp LacivertSportsAndroid/app/build/outputs/apk/debug/app-debug.apk LacivertSports-v1.2.apk
      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: LacivertSports-APK-v1.2
          path: LacivertSports-v1.2.apk
          if-no-files-found: error
          retention-days: 30
