name: Kelime Harikalari Mobile APK

on:
  push:
    branches: [chatgpt-kelime-harikalari-apk-20261025]
    paths:
      - '.github/workflows/kelime-harikalari-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0' 'platform-tools'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Reconstruct mobile APK
        shell: bash
        run: |
          set -euxo pipefail
          cat mobile-apk/part*.b64 > /tmp/mobile-apk.b64
          base64 -d /tmp/mobile-apk.b64 > /tmp/Kelime-Harikalari-mobile-unsigned.apk
          unzip -t /tmp/Kelime-Harikalari-mobile-unsigned.apk
          unzip -p /tmp/Kelime-Harikalari-mobile-unsigned.apk assets/index.html | grep -q 'viewport-fit=cover'
          unzip -p /tmp/Kelime-Harikalari-mobile-unsigned.apk assets/index.html | grep -q 'Kelime Harikaları'
          unzip -p /tmp/Kelime-Harikalari-mobile-unsigned.apk res/drawable-nodpi-v4/app_icon.png > /tmp/app_icon.bin
          test -s /tmp/app_icon.bin

      - name: Zipalign and sign APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 /tmp/Kelime-Harikalari-mobile-unsigned.apk /tmp/Kelime-Harikalari-mobile-aligned.apk
          keytool -genkeypair -v -keystore /tmp/kelime-harikalari.jks -storepass kelimeharikalari -keypass kelimeharikalari -alias kelimeharikalari -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Kelime Harikalari, OU=Mobile, O=Kelime Harikalari, L=Izmir, ST=Izmir, C=TR'
          "$BT/apksigner" sign --ks /tmp/kelime-harikalari.jks --ks-key-alias kelimeharikalari --ks-pass pass:kelimeharikalari --key-pass pass:kelimeharikalari --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Kelime-Harikalari-v1.4-Mobile.apk /tmp/Kelime-Harikalari-mobile-aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          unzip -t Kelime-Harikalari-v1.4-Mobile.apk
          "$BT/zipalign" -c -v 4 Kelime-Harikalari-v1.4-Mobile.apk
          "$BT/apksigner" verify --verbose --print-certs Kelime-Harikalari-v1.4-Mobile.apk
          "$BT/aapt" dump badging Kelime-Harikalari-v1.4-Mobile.apk | grep "package: name='com.omercansiskolu.kelimeharikalari'"
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -j Kelime-Harikalari-v1.4-Mobile.apk 'classes*.dex' -d /tmp/dexcheck
          FOUND=0
          for dex in /tmp/dexcheck/classes*.dex; do
            "$BT/dexdump" -f "$dex" > "$dex.txt"
            if grep -q 'MainActivity' "$dex.txt" && grep -q 'omercansiskolu' "$dex.txt"; then FOUND=1; fi
          done
          test "$FOUND" -eq 1

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Harikalari-v1.4-Mobile
          path: Kelime-Harikalari-v1.4-Mobile.apk
          if-no-files-found: error
          retention-days: 30
