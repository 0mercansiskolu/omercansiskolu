name: Kelime Harikalari APK Build

on:
  push:
    branches: [chatgpt-kelime-harikalari-apk-20261025]
    paths:
      - '.github/workflows/kelime-harikalari-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Projeyi olustur
        shell: bash
        run: |
          rm -rf KelimeHarikalariAndroid
          mkdir -p KelimeHarikalariAndroid/app/src/main/java/com/omercansiskolu/kelimeharikalari
          mkdir -p KelimeHarikalariAndroid/app/src/main/res/{layout,values,drawable-nodpi}
          mkdir -p KelimeHarikalariAndroid/app/src/main/assets
          cat > KelimeHarikalariAndroid/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='KelimeHarikalari'
          include ':app'
          EOT
          cat > KelimeHarikalariAndroid/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOT
          cat > KelimeHarikalariAndroid/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOT
          cat > KelimeHarikalariAndroid/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.omercansiskolu.kelimeharikalari'
            compileSdk 35
            defaultConfig {
              applicationId 'com.omercansiskolu.kelimeharikalari'
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          EOT
          cat > KelimeHarikalariAndroid/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Kelime Harikaları" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon" android:theme="@style/Theme.KelimeHarikalari" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT
          cat > KelimeHarikalariAndroid/app/src/main/res/values/styles.xml <<'EOT'
          <resources>
            <style name="Theme.KelimeHarikalari" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowBackground">#07101F</item>
              <item name="android:statusBarColor">#07101F</item>
              <item name="android:navigationBarColor">#07101F</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOT
          cat > KelimeHarikalariAndroid/app/src/main/res/layout/activity_main.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07101F">
            <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07101F"/>
            <FrameLayout android:id="@+id/splash" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07101F">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="center" android:gravity="center" android:orientation="vertical" android:padding="24dp">
                <ImageView android:layout_width="220dp" android:layout_height="220dp" android:src="@drawable/app_icon" android:scaleType="fitCenter" android:contentDescription="Kelime Harikaları"/>
                <ProgressBar android:layout_width="44dp" android:layout_height="44dp" android:layout_marginTop="24dp" android:indeterminateTint="#FFD166"/>
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp" android:text="Kelime Harikaları yükleniyor..." android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold"/>
              </LinearLayout>
            </FrameLayout>
          </FrameLayout>
          EOT
          cat > KelimeHarikalariAndroid/app/src/main/java/com/omercansiskolu/kelimeharikalari/MainActivity.java <<'EOT'
          package com.omercansiskolu.kelimeharikalari;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView webView;
            private View splash;
            @SuppressLint("SetJavaScriptEnabled")
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              setContentView(R.layout.activity_main);
              webView=findViewById(R.id.webView);
              splash=findViewById(R.id.splash);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              webView.setWebChromeClient(new WebChromeClient());
              webView.setWebViewClient(new WebViewClient(){
                @Override public void onPageStarted(WebView v,String u,Bitmap f){splash.setVisibility(View.VISIBLE);}
                @Override public void onPageCommitVisible(WebView v,String u){splash.postDelayed(()->splash.setVisibility(View.GONE),450);}
              });
              if(b==null) webView.loadUrl("file:///android_asset/index.html"); else { webView.restoreState(b); splash.setVisibility(View.GONE); }
            }
            @Override protected void onSaveInstanceState(Bundle out){webView.saveState(out);super.onSaveInstanceState(out);}
            @Override public void onBackPressed(){if(webView.canGoBack())webView.goBack();else super.onBackPressed();}
          }
          EOT
          cat > /tmp/game.b64 <<'EOT'
          …16647 chars truncated…
          EOT
          tr -d '\n\r ' < /tmp/game.b64 | base64 -d > KelimeHarikalariAndroid/app/src/main/assets/index.html
          cat > /tmp/icon.b64 <<'EOT'
          
          EOT
          tr -d '\n\r ' < /tmp/icon.b64 | base64 -d > KelimeHarikalariAndroid/app/src/main/res/drawable-nodpi/app_icon.png
          file KelimeHarikalariAndroid/app/src/main/res/drawable-nodpi/app_icon.png
      - name: APK derle
        run: gradle -p KelimeHarikalariAndroid :app:assembleDebug --stacktrace
      - name: APK yeniden adlandir
        run: cp KelimeHarikalariAndroid/app/build/outputs/apk/debug/app-debug.apk Kelime-Harikalari-v1.0.apk
      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Harikalari-APK-v1.0
          path: Kelime-Harikalari-v1.0.apk
          if-no-files-found: error
          retention-days: 30
