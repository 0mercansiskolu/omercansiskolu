<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kelime Harikaları</title><style>
:root{--bg:#07101f;--p:#102846;--p2:#173b63;--t:#f6fbff;--m:#b9c7dc;--a:#5ed8ff;--g:#ffd166;--ok:#72ef9a;--bad:#ff758f;--c:44px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--t);background:var(--bg)}body{overflow-x:hidden}.app{min-height:100vh;padding:14px;background:radial-gradient(circle at 20% 10%,#65dfff26,transparent 30%),radial-gradient(circle at 80% 15%,#ffd16620,transparent 28%),linear-gradient(#244f7e,#102947 48%,#06101e);display:flex;flex-direction:column}.top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}.brand{font-weight:1000;font-size:20px;text-shadow:0 4px 0 #08192d,0 12px 24px #0008}.pill,.map{border:1px solid #ffffff1f;background:linear-gradient(#1d416d,#0b1a30);box-shadow:0 5px 0 #06111d,0 12px 24px #0005;border-radius:999px;padding:9px 12px;font-weight:850}.map{border-radius:14px;cursor:pointer}.hero{text-align:center;margin:14px 0 6px}.hero h1{margin:0;font-size:30px;text-shadow:0 4px 0 #0c2238}.hero p{margin:4px;color:var(--m);font-size:12px}.main{flex:1;display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:center;max-width:940px;width:100%;margin:auto}.boardWrap{display:flex;justify-content:center}.board{display:grid;gap:6px;padding:20px;border-radius:28px;background:linear-gradient(#1c385c,#071426);box-shadow:0 14px 0 #050e19,0 28px 60px #0007;border:1px solid #ffffff18}.cell{width:var(--c);height:var(--c);border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#dbeaf5 55%,#b9cedf);color:#10304c;font-weight:1000;font-size:22px;box-shadow:inset 0 2px #fff,0 5px 0 #7f98ac}.cell.empty{visibility:hidden}.cell.on{background:linear-gradient(#fff4c7,#ffd05b 55%,#e9aa25);color:#5a3400;box-shadow:inset 0 2px #fff9,0 5px 0 #966700}.side{display:flex;flex-direction:column;align-items:center}.preview{min-width:180px;min-height:45px;padding:10px 18px;border-radius:999px;background:linear-gradient(#183a61,#08172b);box-shadow:0 5px 0 #06111d;margin-bottom:10px;text-align:center;font-size:22px;font-weight:1000;letter-spacing:4px}.wheel{width:280px;height:280px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 25%,#ffffff18,transparent 20%),linear-gradient(#1c426e,#0a1930);box-shadow:inset 0 2px #fff2,0 10px 0 #06111d,0 28px 50px #0006}.letter{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#dcecf6 60%,#b8ccdc);color:#12304b;font-weight:1000;font-size:29px;border:3px solid #fff;box-shadow:0 6px 0 #829aac,0 14px 22px #0006;cursor:pointer}.letter.sel{background:linear-gradient(#8deeff,#28b9e9 58%,#1688b7);box-shadow:0 6px 0 #0d6a92,0 0 20px #5ed8ff}.shuffle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(#183a61,#08172b);box-shadow:0 5px 0 #06111d;color:#fff;font-size:25px}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:15px;padding:12px 10px;background:linear-gradient(#1b416d,#0b1b32);box-shadow:0 5px 0 #06111d;color:#fff;font-weight:900}.btn.go{grid-column:1/-1;background:linear-gradient(#74e7ff,#2db8e8);color:#05223a}.btn.hint{background:linear-gradient(#75612b,#2f2a1d)}.prog{width:100%;height:8px;background:#ffffff1c;border-radius:99px;margin-top:14px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#4bd3ff,#72ef9a);width:0}.status{font-size:12px;color:var(--m);margin:7px}.hintBox{width:100%;min-height:72px;border-radius:15px;padding:12px 15px;background:linear-gradient(#17355a,#09162b);box-shadow:0 5px 0 #06111d;text-align:center;font-size:13px;line-height:1.45}.hintBox b{color:var(--g)}.bonus{font-size:11px;color:#cbd8e7;margin-top:9px}.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-15px);opacity:0;z-index:50;background:#071425ee;padding:11px 16px;border-radius:999px;font-weight:900;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{color:var(--ok)}.toast.bad{color:var(--bad)}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020711df;z-index:40;padding:18px}.modal.show{display:flex}.card{width:min(420px,100%);padding:25px;border-radius:26px;background:linear-gradient(#1b416d,#09162b);box-shadow:0 10px 0 #06111d,0 30px 70px #000b;text-align:center}.card h2{margin:8px}.stars{color:var(--g);font-size:34px}.next{width:100%;border:0;border-radius:15px;padding:13px;background:linear-gradient(#75e8ff,#2bb7e7);font-weight:1000;color:#05223a}.mapGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-height:65vh;overflow:auto}.node{border:0;border-radius:15px;padding:10px 5px;background:linear-gradient(#1b416d,#0b1b32);box-shadow:0 4px 0 #06111d;color:#fff;font-weight:900}.node.lock{opacity:.35}.node.cur{outline:3px solid var(--a)}@media(max-width:760px){:root{--c:37px}.app{padding:9px}.brand{font-size:15px}.main{grid-template-columns:1fr;gap:2px}.board{padding:12px;gap:4px}.hero h1{font-size:24px}.wheel{width:255px;height:255px}.letter{width:57px;height:57px;font-size:25px}.preview{min-height:40px}.mapGrid{grid-template-columns:repeat(4,1fr)}}@media(max-height:760px) and (max-width:760px){:root{--c:31px}.hero{margin:4px}.wheel{width:225px;height:225px}.letter{width:52px;height:52px}.board{padding:8px}}
</style></head><body><div class="app"><div class="top"><div class="brand">KELİME HARİKALARI</div><div class="pill">Bölüm <span id="lv">1</span>/100 · <span style="color:#ffd166">●</span> <span id="score">0</span></div><button class="map" id="map">🗺️</button></div><div class="hero"><h1 id="city">İzmir</h1><p>Harfleri sırayla tıkla ve kelimeyi onayla.</p></div><div class="main"><div class="boardWrap"><div class="board" id="board"></div></div><div class="side"><div class="preview" id="preview">&nbsp;</div><div class="wheel" id="wheel"><button class="shuffle" id="shuffle">↻</button></div><div class="actions"><button class="btn hint" id="hint">💡 İpucu (-10)</button><button class="btn" id="clear">↺ Seçimi Sil</button><button class="btn go" id="submit">✓ Kelimeyi Onayla</button></div><div class="prog"><i id="bar"></i></div><div class="status" id="status"></div><div class="hintBox" id="hintBox">İpucu almak için butona bas.</div><div class="bonus" id="bonus"></div></div></div></div><div class="toast" id="toast"></div><div class="modal" id="done"><div class="card"><div class="stars" id="doneStars">★★★</div><h2>Bölüm Tamamlandı!</h2><p id="doneText"></p><button class="next" id="next">Sonraki Bölüm →</button></div></div><div class="modal" id="mapModal"><div class="card" style="width:min(650px,100%)"><h2>Bölüm Haritası</h2><div class="mapGrid" id="mapGrid"></div><button class="next" style="margin-top:14px" id="closeMap">Kapat</button></div></div>
<script>
const T=["İzmir","İstanbul","Kapadokya","Antalya","Mardin","Paris","Roma","Tokyo","New York","Kahire"];
const G=[["AŞK","KAŞ"],["MAÇ","ÇAM"],["KALP","KAP","ALP"],["PARA","ARPA"],["KARA","KAR","ARA"],["MASA","ASMA"],["KAPI","KAP","PAK"],["KALEM","KALE","KEL"],["KEMAN","KAN","NAM"],["BALIK","BAL","BAK","KAL"],["ÇANTA","ANA","ATA","ÇAT"],["MASKE","KASE","KES"],["KUMAR","KUM","KUR"],["SALON","SOL","SON","SAL"],["KOLAY","KOL","YOL","AY"],["GÜNEŞ","GÜN","EŞ","ŞEN"],["YAZAR","YAZ","ARA","YAR"],["MOTOR","MOR","OT"],["SEPET","PES","SET","ET"],["KAYAK","KAYA","YAK","KAY"],["YEMEK","YEM","EMEK"],["ÇİLEK","ÇİLE","İLE","ÇEK","KİL"],["KÖPEK","KÖK","PEK"],["BİLET","BEL","TEL","BİT","EL"],["TOPRAK","TOP","KOR","KAP","TOK","RAP"],["KARTAL","KART","KAL","KAR","ALT","ATA"],["PATEN","PAN","TAN","NET","PAT"],["OYNAK","YAN","KAN","YAK","OY"],["ŞAPKA","ŞAP","KAP","KAŞ","AŞK"],["MAKAS","KASA","ASA","KAM"]];
const D={AŞK:"Birine karşı duyulan güçlü sevgi.",KAŞ:"Gözün hemen üzerindeki kıllı bölüm.",MAÇ:"İki takım veya rakip arasındaki karşılaşma.",ÇAM:"İğne yapraklı, kışın da yeşil kalan ağaç.",KALP:"Vücutta kanı pompalayan organ.",PARA:"Alışverişte kullanılan ödeme aracı.",ARPA:"Bir tahıl türü.",KARA:"Siyah renk veya deniz olmayan toprak.",KAR:"Kışın gökten yağan beyaz yağış.",MASA:"Üzerinde çalışılan veya yemek yenilen mobilya.",KAPI:"Giriş çıkış sağlayan açılır bölüm.",KALEM:"Yazı yazmaya yarayan araç.",KALE:"Savunma amacıyla yapılmış sağlam yapı.",KEMAN:"Yayla çalınan telli müzik aleti.",BALIK:"Suda yaşayan, solungaçla nefes alan canlı.",BAL:"Arıların yaptığı tatlı besin.",ÇANTA:"Eşya taşımaya yarayan araç.",MASKE:"Yüzü örten nesne.",KUM:"Sahillerde bulunan küçük taş parçaları.",SALON:"Evdeki geniş oturma alanı.",KOLAY:"Yapılması fazla güç olmayan.",GÜNEŞ:"Dünya'ya ışık ve ısı veren yıldız.",YAZAR:"Kitap veya metin yazan kişi.",MOTOR:"Makineyi hareket ettiren güç ünitesi.",SEPET:"Eşya taşımaya yarayan örgülü kap.",KAYAK:"Kar üzerinde yapılan spor ve kullanılan araç.",YEMEK:"Beslenmek için tüketilen yiyecek.",ÇİLEK:"Kırmızı ve tatlı bir meyve.",KÖPEK:"İnsanlarla yaşayan evcil memeli.",BİLET:"Yolculuk veya etkinlik giriş belgesi.",TOPRAK:"Bitkilerin yetiştiği yeryüzü katmanı.",KARTAL:"Büyük yırtıcı kuş.",PATEN:"Ayağa takılarak kaymaya yarayan araç.",ŞAPKA:"Başa takılan giysi.",MAKAS:"Kesmek için kullanılan iki ağızlı araç."};
const $=x=>document.getElementById(x),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let s={lv:Math.max(0,Math.min(99,+localStorage.khLevel||0)),score:+localStorage.khScore||0,unlock:+localStorage.khUnlock||0,stars:JSON.parse(localStorage.khStars||"{}"),found:new Set,bonus:new Set,sel:[],letters:[],hints:new Set,used:0,layout:null};s.unlock=Math.max(s.unlock,s.lv);
function save(){localStorage.khLevel=s.lv;localStorage.khScore=s.score;localStorage.khUnlock=s.unlock;localStorage.khStars=JSON.stringify(s.stars)}
function data(){let w=G[s.lv%G.length].map(x=>x.toLocaleUpperCase("tr-TR"));let longest=w.reduce((a,b)=>a.length>=b.length?a:b);return{w,letters:sh([...longest])}}
function cross(words){words=[...words].sort((a,b)=>b.length-a.length);let m=new Map,p=[],k=(x,y)=>x+","+y,g=(x,y)=>m.get(k(x,y)),put=(x,y,c)=>m.set(k(x,y),c);let f=words.shift(),sx=-Math.floor(f.length/2);[...f].forEach((c,i)=>put(sx+i,0,c));p.push({w:f,x:sx,y:0,d:"H"});for(let w of words){let best=null;for(let [kk,ch] of m){let [gx,gy]=kk.split(",").map(Number);[...w].forEach((c,wi)=>{if(c!=ch)return;for(let d of ["H","V"]){let x=gx-(d=="H"?wi:0),y=gy-(d=="V"?wi:0),ok=1,cr=0;for(let i=0;i<w.length;i++){let xx=x+(d=="H"?i:0),yy=y+(d=="V"?i:0),e=g(xx,yy);if(e&&e!=w[i])ok=0;if(e==w[i])cr++}if(ok&&cr&&!best)best={x,y,d}}})}if(!best){let ys=[...m.keys()].map(q=>+q.split(",")[1]);best={x:-Math.floor(w.length/2),y:Math.max(...ys)+2,d:"H"}}[...w].forEach((c,i)=>put(best.x+(best.d=="H"?i:0),best.y+(best.d=="V"?i:0),c));p.push({w,...best})}let xs=[...m.keys()].map(q=>+q.split(",")[0]),ys=[...m.keys()].map(q=>+q.split(",")[1]);return{m,p,minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)}}
function board(){let d=data();s.layout=cross(d.w);let L=s.layout,cols=L.maxX-L.minX+1,b=$("board");b.innerHTML="";b.style.gridTemplateColumns=`repeat(${cols},var(--c))`;for(let y=L.minY;y<=L.maxY;y++)for(let x=L.minX;x<=L.maxX;x++){let c=document.createElement("div"),ch=L.m.get(x+","+y);c.className="cell"+(ch?"":" empty");c.dataset.x=x;c.dataset.y=y;c.dataset.ch=ch||"";if(ch&&revealAt(x,y)){c.textContent=ch;c.classList.add("on")}b.appendChild(c)}}
function revealAt(x,y){return s.layout.p.some(p=>s.found.has(p.w)&&[...p.w].some((_,i)=>p.x+(p.d=="H"?i:0)==x&&p.y+(p.d=="V"?i:0)==y))}
function reveal(w){let p=s.layout.p.find(q=>q.w==w);if(!p)return;[...w].forEach((ch,i)=>{let x=p.x+(p.d=="H"?i:0),y=p.y+(p.d=="V"?i:0),c=[...$("board").children].find(n=>+n.dataset.x==x&&+n.dataset.y==y);if(c){c.textContent=ch;c.classList.add("on")}})}
function wheel(){let w=$("wheel");[...w.querySelectorAll(".letter")].forEach(n=>n.remove());s.letters=data().letters;let n=s.letters.length,r=92;s.letters.forEach((ch,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,b=document.createElement("div");b.className="letter";b.textContent=ch;b.dataset.i=i;b.style.left=(140+Math.cos(a)*r)+"px";b.style.top=(140+Math.sin(a)*r)+"px";b.onclick=()=>pick(i);w.appendChild(b)});clear()}
function pick(i){if(s.sel.includes(i))return;s.sel.push(i);syncSel()}
function syncSel(){$("preview").textContent=s.sel.map(i=>s.letters[i]).join("")||" ";[...document.querySelectorAll(".letter")].forEach(n=>n.classList.toggle("sel",s.sel.includes(+n.dataset.i)))}
function clear(){s.sel=[];syncSel()}
function toast(t,type="ok"){let e=$("toast");e.textContent=t;e.className="toast show "+type;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="toast",900)}
function header(){let d=data(),done=s.found.size,total=d.w.length;$("lv").textContent=s.lv+1;$("score").textContent=s.score;$("city").textContent=T[s.lv%T.length];$("bar").style.width=(done/total*100)+"%";$("status").textContent=done+"/"+total+" ana kelime bulundu • "+(total-done)+" kaldı";$("bonus").textContent=s.bonus.size?"Bonus: "+[...s.bonus].join(", "):""}
function submit(){let w=s.sel.map(i=>s.letters[i]).join(""),d=data();if(!w)return toast("Önce harf seç","bad");if(d.w.includes(w)){if(s.found.has(w))toast("Bu kelime bulundu","bad");else{s.found.add(w);reveal(w);toast(w+" doğru!");header();save();if(s.found.size==d.w.length)setTimeout(done,300)}}else if(w.length>=3){if(!s.bonus.has(w)){s.bonus.add(w);toast("Bonus kelime");header()}else toast("Kelime listede değil","bad")}else toast("Daha uzun dene","bad");clear()}
function hintOptions(w){let a=[];if(D[w])a.push({id:"d",t:"Anlam ipucu",b:D[w]});a.push({id:"f",t:"Harf ipucu",b:`Kelime <b>${w[0]}</b> ile başlıyor ve ${w.length} harfli.`});a.push({id:"l",t:"Harf ipucu",b:`Son harf <b>${w.at(-1)}</b>.`});if(w.length>3)a.push({id:"m",t:"Konum ipucu",b:`Ortadaki harflerden biri <b>${w[Math.floor(w.length/2)]}</b>.`});if(w.length>=4)a.push({id:"p",t:"Kelime kalıbı",b:[...w].map((c,i)=>i==0||i==w.length-1?c:"•").join(" ")});return a}
function hint(){if(s.score<10){$("hintBox").textContent="Yetersiz puan: ipucu alınamadı.";return toast("En az 10 puan gerekli","bad")}let rem=data().w.filter(w=>!s.found.has(w)),all=[];for(let w of rem)for(let h of hintOptions(w)){let k=w+":"+h.id;if(!s.hints.has(k))all.push({w,h,k})}if(!all.length){$("hintBox").textContent="Yeni ipucu kalmadı. Puan düşürülmedi.";return toast("Yeni ipucu yok","bad")}let q=all[Math.floor(Math.random()*all.length)];s.hints.add(q.k);s.score-=10;s.used++;save();header();$("hintBox").innerHTML=`<b>${q.w.length} harfli kelime</b><br><span style="color:#9fe6ff;font-weight:800">${q.h.t}:</span> ${q.h.b}`;toast("-10 puan • Yeni ipucu")}
function done(){let st=s.used==0?3:s.used<=2?2:1;s.stars[s.lv]=Math.max(s.stars[s.lv]||0,st);s.unlock=Math.max(s.unlock,Math.min(99,s.lv+1));s.score+=50;save();$("doneStars").textContent="★".repeat(st)+"☆".repeat(3-st);$("doneText").innerHTML=`Bölümü tamamladın.<br><b style="color:#ffd166">+50 puan</b>`;$("done").classList.add("show")}
function next(){s.lv=(s.lv+1)%100;$("done").classList.remove("show");load()}
function map(){let g=$("mapGrid");g.innerHTML="";for(let i=0;i<100;i++){let b=document.createElement("button"),lock=i>s.unlock,st=s.stars[i]||0;b.className="node"+(lock?" lock":"")+(i==s.lv?" cur":"");b.innerHTML=`${lock?"🔒":i+1}<br><span style="color:#ffd166">${"★".repeat(st)}${"☆".repeat(3-st)}</span>`;if(!lock)b.onclick=()=>{s.lv=i;$("mapModal").classList.remove("show");load()};g.appendChild(b)}$("mapModal").classList.add("show")}
function load(){s.found=new Set;s.bonus=new Set;s.sel=[];s.hints=new Set;s.used=0;board();wheel();header();$("hintBox").textContent="İpucu almak için butona bas.";save()}
$("submit").onclick=submit;$("clear").onclick=clear;$("shuffle").onclick=()=>{s.letters=sh(s.letters);[...document.querySelectorAll(".letter")].forEach((n,i)=>n.textContent=s.letters[i]);clear()};$("hint").onclick=hint;$("next").onclick=next;$("map").onclick=map;$("closeMap").onclick=()=>$("mapModal").classList.remove("show");load();
</script></body></html>
